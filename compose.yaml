services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000", "-e", "development"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
    tmpfs:
      - /app/backend/tmp/pids
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
